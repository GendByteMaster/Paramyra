name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/master"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload release-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paramyra-visual-review
          path: |
            test-results/release-review/
            test-results/physics-*/**/*.png
          if-no-files-found: ignore
          retention-days: 14
